# Overrides on top of detekt's default configuration (buildUponDefaultConfig = true).
# Formatting is ktlint's job (.editorconfig); detekt checks complexity and bugs.

naming:
  MatchingDeclarationName:
    # Compose files are named after their main composable (LoSlider.kt), which is a
    # function; the rule would demand they be named after a helper class instead.
    active: false
  FunctionNaming:
    # @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    # Compose tokens such as `val RobotoFlex = FontFamily(...)` are PascalCase.
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    # Design tokens and constants are declared as properties; tests use literals freely;
    # enum entries carry data such as the stage that implements a settings row.
    ignoreEnums: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable']
    excludes: ['**/test/**', '**/androidTest/**']
  ReturnCount:
    max: 3
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    # Data-access APIs (DAO, repository, library) and Compose screen files, made of small
    # private composables, legitimately exceed detekt's default of 11.
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 20
    excludes: ['**/test/**', '**/androidTest/**']
