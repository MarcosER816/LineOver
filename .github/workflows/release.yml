name: Release

# Pushing a tag v* (for example v0.1.0) builds the signed release APK and
# publishes it as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install NDK and CMake
        run: tools/ci/install-native-toolchain.sh
      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::A release must be signed with the release key. Add the secrets KEYSTORE_B64, KEYSTORE_PASS, KEY_ALIAS and KEY_PASS (see README.md, Signing)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lineover-release.jks"
          echo "LINEOVER_KEYSTORE_FILE=$RUNNER_TEMP/lineover-release.jks" >> "$GITHUB_ENV"
      - name: Assemble release
        env:
          LINEOVER_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          LINEOVER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LINEOVER_KEY_PASS: ${{ secrets.KEY_PASS }}
        run: ./gradlew assembleRelease
      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lineover-release.jks"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="lineover-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$TAG" "$apk" "$apk.sha256" --title "LineOver $TAG" --generate-notes --verify-tag
