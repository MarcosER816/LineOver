# LineOver version catalog. Every version here was verified against Google Maven /
# Maven Central on 2026-11-16 (see docs/stages/STAGE_00.md for the audit table).
[versions]
# SDK levels (rule R0 / D2) and native toolchain
compileSdk = "36"
minSdk = "34"
targetSdk = "36"
ndk = "28.2.13676358"
cmake = "3.31.6"

agp = "9.5.1"
kotlin = "2.4.21"
kotlinxSerialization = "1.13.0"
kotlinxCoroutines = "1.11.0"

# Newest BOM whose artifacts still build against compileSdk 36 (compose 1.11.4, material3 1.4.0).
# 2026.08.00+ (compose 1.12) needs compileSdk 37, which D2 rules out.
composeBom = "2026.06.01"
androidxActivity = "1.13.0"
# core 1.19+ and lifecycle 2.11+ need compileSdk 37.
androidxCore = "1.18.0"
androidxLifecycle = "2.10.0"
androidxProfileinstaller = "1.4.1"
androidxBenchmark = "1.5.0"
androidxUiautomator = "2.4.1"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

litert = "2.3.2"

# Stage 2. All checked to build against compileSdk 36 (minCompileSdk <= 36).
navigation3 = "1.2.1"
room = "2.8.5"
ksp = "2.3.14"
androidxSplashscreen = "1.2.0"
androidxWindow = "1.5.1"
# Stage 4. minCompileSdk 34 (checked in aar-metadata).
androidxExifinterface = "1.4.2"
# HEIF and AVIF export (Stage 12), Apache-2.0; 1.2.0 has AvifWriter, minCompileSdk 34.
androidxHeifwriter = "1.2.0"

junit = "4.13.2"
robolectric = "4.18"
roborazzi = "1.79.0"
detekt = "1.23.8"
ktlint = "1.8.0"

[libraries]
# Build-logic classpath
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
roborazzi-gradlePlugin = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }
androidx-baselineprofile-gradlePlugin = { module = "androidx.baselineprofile:androidx.baselineprofile.gradle.plugin", version.ref = "androidxBenchmark" }
room-gradlePlugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }

# Kotlin
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

# AndroidX / Compose (versions of compose artifacts come from the BOM)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxSplashscreen" }
androidx-window-core = { module = "androidx.window:window-core", version.ref = "androidxWindow" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "androidxExifinterface" }
androidx-heifwriter = { module = "androidx.heifwriter:heifwriter", version.ref = "androidxHeifwriter" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidxProfileinstaller" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxUiautomator" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

# On-device ML runtime. Pinned here, wired into :core:ml by the first stage that
# ships an AI tool (models themselves are never bundled, rule R0 / D3).
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
